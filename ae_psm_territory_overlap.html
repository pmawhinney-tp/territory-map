
<style>
  .map-container { padding: 1rem 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-secondary); }
  .legend-swatch { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; }
  svg text { font-family: var(--font-sans); font-size: 7px; pointer-events: none; }
  .tooltip { position: absolute; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 8px 12px; font-size: 12px; color: var(--color-text-primary); pointer-events: none; opacity: 0; transition: opacity 0.15s; max-width: 200px; z-index: 10; }
  .state-path { cursor: pointer; stroke: #fff; stroke-width: 0.5; transition: opacity 0.15s; }
  .state-path:hover { opacity: 0.75; stroke-width: 1.5; }
  h2.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .filter-btn { font-size: 12px; padding: 4px 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-secondary); cursor: pointer; }
  .alignment-section { margin-top: 2rem; border-top: 0.5px solid var(--color-border-tertiary); padding-top: 1.5rem; }
  .alignment-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.5rem; }
  .align-card { background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; }
  .align-card-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 8px; }
  .align-card-subtitle { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 10px; }
  .ae-chip { display: inline-flex; align-items: center; font-size: 11px; padding: 3px 8px; border-radius: var(--border-radius-md); margin: 2px; }
  .ae-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .section-label { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
  .ae-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 0.5px solid var(--color-border-tertiary); font-size: 13px; flex-wrap: wrap; }
  .ae-row:last-child { border-bottom: none; }
  .ae-name { font-weight: 500; color: var(--color-text-primary); display: flex; align-items: center; gap: 8px; min-width: 160px; }
  .ae-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .psm-tag { font-size: 11px; color: var(--color-text-secondary); background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 2px 8px; white-space: nowrap; }
  .psm-tags { display: flex; gap: 4px; flex-wrap: wrap; }
</style>

<h2 class="sr-only">US map and alignment table showing AE territory assignments overlaid with PSM coverage for TalkingPoints sales team</h2>

<div class="map-container" style="position:relative;">
  <div class="filters" id="filters">
    <button class="filter-btn" data-filter="all">All</button>
    <button class="filter-btn" data-filter="ae">AE only</button>
    <button class="filter-btn" data-filter="psm">PSM only</button>
  </div>
  <div class="legend" id="legend"></div>
  <div style="position:relative;">
    <svg id="map" viewBox="0 0 960 600" style="width:100%;height:auto;display:block;"></svg>
  </div>
  <div class="tooltip" id="tooltip"></div>
</div>

<div class="alignment-section">
  <p class="section-label">PSM → AE alignment</p>
  <div class="alignment-grid">
    <div class="align-card">
      <div class="align-card-title">Donnaly / Sujeiry</div>
      <div class="align-card-subtitle">AEs in their territory</div>
      <div class="ae-list" id="psm-ds-aes"></div>
    </div>
    <div class="align-card">
      <div class="align-card-title">Kristin / Kaleigh</div>
      <div class="align-card-subtitle">AEs in their territory</div>
      <div class="ae-list" id="psm-kk-aes"></div>
    </div>
  </div>

  <p class="section-label" style="margin-top:1.5rem;">AE → PSM alignment</p>
  <div id="ae-psm-list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const AE_COLORS = {
  "Vanessa Tompkins": "#534AB7",
  "Whitney Cooper": "#0F6E56",
  "Adam Carruthers": "#993C1D",
  "Jake Stewart": "#993556",
  "Brett Wheeler": "#185FA5",
  "Chris Sorrell": "#854F0B"
};
const AE_LIGHTS = {
  "Vanessa Tompkins": "#EEEDFE",
  "Whitney Cooper": "#E1F5EE",
  "Adam Carruthers": "#FAECE7",
  "Jake Stewart": "#FBEAF0",
  "Brett Wheeler": "#E6F1FB",
  "Chris Sorrell": "#FAEEDA"
};

const PSM_STATES_DS = new Set(["AL","AR","CT","DE","FL","GA","IN","KY","LA","ME","MD","MA","MS","MO","NE","NH","NJ","NY","NC","ND","PA","RI","SC","SD","TN","TX","VT","VA","WV","DC"]);
const PSM_STATES_KK = new Set(["AZ","CA","AK","CO","HI","ID","IL","KS","MT","NV","NM","OR","UT","WA","WI","WY","IA","MN","MI","OH","OK"]);

const ADAM_STATES = ["VA","NC","SC","GA","FL","AL","MS","DC","MD","AK"];
const JAKE_NE = ["ME","NH","VT","MA","RI","CT","NY","NJ","DE","PA"];
const BRETT_STATES = ["MN","WI","IL","MI","TN","IN","OH","KY","WV","WA","OR","ID","WY"];
const CHRIS_STATES = ["TX","OK","AR","LA","IA","NE","KS","MO","NM","NV","CO","UT","AZ"];
const WHITNEY_MQL = ["CA","MT","HI","ND","SD","AK"];
const VANESSA_T7_A1 = ["ME","NH","VT","MA","RI","CT","NY","NJ","DE","PA","MD","DC","VA","NC","SC","GA","FL","AL","MS","TN","KY","WV","IN","OH","MI","WI","MN","ND","SD","NE","IA","MO","AR","LA","TX","OK","KS"];

const AE_STATE_MAP = {};
ADAM_STATES.forEach(s => AE_STATE_MAP[s] = "Adam Carruthers");
JAKE_NE.forEach(s => AE_STATE_MAP[s] = "Jake Stewart");
BRETT_STATES.forEach(s => AE_STATE_MAP[s] = "Brett Wheeler");
CHRIS_STATES.forEach(s => AE_STATE_MAP[s] = "Chris Sorrell");
WHITNEY_MQL.forEach(s => AE_STATE_MAP[s] = "Whitney Cooper");
["CA","OR","WA","ID","MT","WY","NV","UT","CO","AZ","NM","HI"].forEach(s => { if (!AE_STATE_MAP[s]) AE_STATE_MAP[s] = "Whitney Cooper"; });
VANESSA_T7_A1.forEach(s => { if (!AE_STATE_MAP[s]) AE_STATE_MAP[s] = "Vanessa Tompkins"; });

const AE_PSM_OVERRIDE = {
  "Vanessa Tompkins": ["Donnaly/Sujeiry", "Kristin/Kaleigh"],
  "Whitney Cooper": ["Donnaly/Sujeiry", "Kristin/Kaleigh"]
};

function getPSMsForAE(aeName) {
  if (AE_PSM_OVERRIDE[aeName]) return AE_PSM_OVERRIDE[aeName];
  const psms = new Set();
  Object.entries(AE_STATE_MAP).forEach(([state, ae]) => {
    if (ae === aeName) {
      if (PSM_STATES_DS.has(state)) psms.add("Donnaly/Sujeiry");
      if (PSM_STATES_KK.has(state)) psms.add("Kristin/Kaleigh");
    }
  });
  return [...psms];
}

function getAEsForPSM(psmStates) {
  const aes = new Set();
  psmStates.forEach(state => { if (AE_STATE_MAP[state]) aes.add(AE_STATE_MAP[state]); });
  return [...aes];
}

function buildAlignmentSections() {
  const dsAEs = getAEsForPSM([...PSM_STATES_DS]);
  const kkAEs = getAEsForPSM([...PSM_STATES_KK]);

  document.getElementById("psm-ds-aes").innerHTML = dsAEs.map(ae =>
    `<span class="ae-chip" style="background:${AE_LIGHTS[ae]};border:1px solid ${AE_COLORS[ae]};color:${AE_COLORS[ae]}">${ae}</span>`
  ).join("");

  document.getElementById("psm-kk-aes").innerHTML = kkAEs.map(ae =>
    `<span class="ae-chip" style="background:${AE_LIGHTS[ae]};border:1px solid ${AE_COLORS[ae]};color:${AE_COLORS[ae]}">${ae}</span>`
  ).join("");

  document.getElementById("ae-psm-list").innerHTML = Object.keys(AE_COLORS).map(ae => {
    const psms = getPSMsForAE(ae);
    return `<div class="ae-row">
      <div class="ae-name">
        <div class="ae-dot" style="background:${AE_COLORS[ae]}"></div>
        ${ae}
      </div>
      <div class="psm-tags">${psms.map(p => `<span class="psm-tag">${p}</span>`).join("")}</div>
    </div>`;
  }).join("");
}

let currentFilter = "all";
const nameToAbbr = {
  "Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR","California":"CA","Colorado":"CO",
  "Connecticut":"CT","Delaware":"DE","Florida":"FL","Georgia":"GA","Hawaii":"HI","Idaho":"ID",
  "Illinois":"IL","Indiana":"IN","Iowa":"IA","Kansas":"KS","Kentucky":"KY","Louisiana":"LA",
  "Maine":"ME","Maryland":"MD","Massachusetts":"MA","Michigan":"MI","Minnesota":"MN","Mississippi":"MS",
  "Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV","New Hampshire":"NH","New Jersey":"NJ",
  "New Mexico":"NM","New York":"NY","North Carolina":"NC","North Dakota":"ND","Ohio":"OH","Oklahoma":"OK",
  "Oregon":"OR","Pennsylvania":"PA","Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD",
  "Tennessee":"TN","Texas":"TX","Utah":"UT","Vermont":"VT","Virginia":"VA","Washington":"WA",
  "West Virginia":"WV","Wisconsin":"WI","Wyoming":"WY","District of Columbia":"DC"
};

const svg = d3.select("#map");
const tooltip = document.getElementById("tooltip");

svg.append("defs").html(`
  <pattern id="pat-kk" patternUnits="userSpaceOnUse" width="7" height="7">
    <circle cx="3.5" cy="3.5" r="1.8" fill="#888780" fill-opacity="0.7"/>
  </pattern>
`);

const statesGroup = svg.append("g").attr("id","states-base");
const psmKKGroup = svg.append("g").attr("id","psm-kk-overlay");
const labelsGroup = svg.append("g").attr("id","labels");

function getStateFill(abbr, filter) {
  if (filter === "psm") return "#e8e8e0";
  const ae = AE_STATE_MAP[abbr];
  return ae ? AE_LIGHTS[ae] : "#e8e8e0";
}

function setActiveBtn(filter) {
  document.querySelectorAll(".filter-btn").forEach(b => {
    const active = b.dataset.filter === filter;
    b.style.background = active ? "var(--color-background-secondary)" : "var(--color-background-primary)";
    b.style.color = active ? "var(--color-text-primary)" : "var(--color-text-secondary)";
    b.style.borderColor = active ? "var(--color-border-primary)" : "var(--color-border-secondary)";
    b.style.fontWeight = active ? "500" : "400";
  });
}

fetch("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json")
  .then(r => r.json())
  .then(us => {
    const states = topojson.feature(us, us.objects.states);
    const projection = d3.geoAlbersUsa().scale(1200).translate([480,300]);
    const path = d3.geoPath().projection(projection);
    const stateNames = {};
    us.objects.states.geometries.forEach(g => { stateNames[g.id] = g.properties.name; });

    statesGroup.selectAll("path")
      .data(states.features)
      .join("path")
      .attr("class","state-path")
      .attr("d", path)
      .attr("fill", d => {
        const abbr = nameToAbbr[stateNames[d.id]];
        return getStateFill(abbr, currentFilter);
      })
      .attr("stroke","#fff")
      .attr("stroke-width","0.5")
      .on("mousemove", function(event, d) {
        const name = stateNames[d.id];
        const abbr = nameToAbbr[name];
        const ae = AE_STATE_MAP[abbr] || "Unassigned";
        let psm = "—";
        if (PSM_STATES_DS.has(abbr)) psm = "Donnaly/Sujeiry";
        else if (PSM_STATES_KK.has(abbr)) psm = "Kristin/Kaleigh";
        const container = document.querySelector(".map-container").getBoundingClientRect();
        tooltip.innerHTML = `<strong style="font-size:13px">${name} (${abbr||""})</strong><br><span style="color:var(--color-text-secondary);font-size:11px">AE: ${ae}</span><br><span style="color:var(--color-text-secondary);font-size:11px">PSM: ${psm}</span>`;
        tooltip.style.left = (event.clientX - container.left + 10) + "px";
        tooltip.style.top = (event.clientY - container.top - 10) + "px";
        tooltip.style.opacity = "1";
      })
      .on("mouseleave", () => { tooltip.style.opacity = "0"; });

    psmKKGroup.selectAll(".psm-kk")
      .data(states.features.filter(d => PSM_STATES_KK.has(nameToAbbr[stateNames[d.id]])))
      .join("path")
      .attr("class","state-path psm-kk")
      .attr("d", path)
      .attr("fill","url(#pat-kk)")
      .attr("stroke","none")
      .style("pointer-events","none");

    states.features.forEach(d => {
      const centroid = path.centroid(d);
      if (!centroid || isNaN(centroid[0])) return;
      const abbr = nameToAbbr[stateNames[d.id]];
      if (!abbr || abbr === "DC") return;
      labelsGroup.append("text")
        .attr("x", centroid[0])
        .attr("y", centroid[1]+2.5)
        .attr("text-anchor","middle")
        .attr("fill","#666")
        .attr("font-size","6px")
        .text(abbr);
    });

    buildLegend();
    buildAlignmentSections();
    setActiveBtn("all");

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", function() {
        currentFilter = this.dataset.filter;
        setActiveBtn(currentFilter);
        statesGroup.selectAll("path")
          .attr("fill", d => {
            const abbr = nameToAbbr[stateNames[d.id]];
            return getStateFill(abbr, currentFilter);
          });
        psmKKGroup.style("opacity", currentFilter === "ae" ? 0 : 1);
      });
    });
  });

function buildLegend() {
  const leg = document.getElementById("legend");
  let html = Object.entries(AE_COLORS).map(([name, color]) =>
    `<div class="legend-item"><div class="legend-swatch" style="background:${AE_LIGHTS[name]};border:1.5px solid ${color}"></div><span>${name} (AE)</span></div>`
  ).join("");
  html += `<div class="legend-item"><div class="legend-swatch" style="background:#fff;border:0.5px solid #ccc;"></div><span>Donnaly/Sujeiry (PSM)</span></div>`;
  html += `<div class="legend-item"><div class="legend-swatch" style="background-color:#fff;background-image:radial-gradient(circle,rgba(136,135,128,0.7) 1.8px,transparent 1.8px);background-size:7px 7px;border:0.5px solid #ccc;"></div><span>Kristin/Kaleigh (PSM)</span></div>`;
  leg.innerHTML = html;
}
</script>
